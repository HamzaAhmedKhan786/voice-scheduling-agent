<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vikara AI - Voice Scheduler</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: #0f172a; color: white; margin: 0; }
        #call-btn { padding: 20px 40px; font-size: 1.2rem; cursor: pointer; border-radius: 50px; border: none; background: #6366f1; color: white; transition: 0.3s; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); z-index: 10; }
        #call-btn:hover { background: #4f46e5; transform: scale(1.05); }
        #status { margin-top: 20px; color: #94a3b8; font-size: 1rem; font-weight: bold; }
        
        /* Live Chat Styling */
        #chat-container { margin-top: 30px; width: 80%; max-width: 500px; background: #1e293b; border-radius: 12px; padding: 15px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
        #transcript-label { color: #6366f1; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        #transcript-content { color: #e2e8f0; font-style: italic; min-height: 50px; line-height: 1.5; }
    </style>
</head>
<body>
    <button id="call-btn">🎤 Talk to Scheduler</button>
    <div id="status">Ready to connect...</div>

    <div id="chat-container">
        <div id="transcript-label">Live Transcript</div>
        <div id="transcript-content">Waiting for conversation to start...</div>
    </div>

    <script>
        var vapiInstance = null;
        const assistant = "ce4ff5ee-699f-4154-ba1c-3c87e69cf7cf"; 
        const apiKey = "7aaacbc2-d5ef-4814-97e1-2e8a6f038238"; 

        (function (d, t) {
            var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
            g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
            g.defer = true; g.async = true;
            s.parentNode.insertBefore(g, s);
            g.onload = function () {
                console.log("✅ Vapi SDK Loaded");
                document.getElementById('status').innerText = "Vapi Online";
            };
        })(document, "script");

        const btn = document.getElementById('call-btn');
        const status = document.getElementById('status');
        const transcriptContent = document.getElementById('transcript-content');

        btn.addEventListener('click', () => {
            if (window.vapiSDK) {
                if (vapiInstance) {
                    vapiInstance.stop();
                    return;
                }

                vapiInstance = window.vapiSDK.run({
                    apiKey: apiKey,
                    assistant: assistant,
                    config: {} 
                });

                btn.innerText = "🛑 Stop Call";
                status.innerText = "Connecting to Vikara AI...";

                vapiInstance.on('call-start', () => {
                    status.innerText = "Call Active - Start Speaking!";
                    btn.style.background = "#ef4444";
                });

                // LIVE CHAT TRANSCRIPT LOGIC
                vapiInstance.on('message', (message) => {
                    if (message.type === 'transcript' && message.transcriptType === 'partial') {
                        transcriptContent.innerText = message.transcript;
                    }
                });

                vapiInstance.on('call-end', (event) => {
                    // Check if call dropped due to silence
                    // The 'endedReason' might vary, but we can check if it was a timeout
                    if (event && (event.reason === 'silence-timeout' || event.reason === 'no-response')) {
                        status.innerText = "Call Dropped: No response from user.";
                    } else {
                        status.innerText = "Call Ended. Session complete.";
                    }

                    vapiInstance = null;
                    btn.innerText = "🎤 Talk to Scheduler";
                    btn.style.background = "#6366f1";
                });

                vapiInstance.on('error', (e) => {
                    console.error(e);
                    status.innerText = "Error: " + e.message;
                });
            } else {
                alert("Vapi SDK is still loading.");
            }
        });
    </script>
</body>
</html>
